Organizations:
  - &OrdererOrg
    Name: OrdererMSP
    ID: OrdererMSP
    MSPDir: ../organizations/ordererOrganizations/example.com/msp
    Policies:
      Readers:  { Type: Signature, Rule: "OR('OrdererMSP.member')" }
      Writers:  { Type: Signature, Rule: "OR('OrdererMSP.member')" }
      Admins:   { Type: Signature, Rule: "OR('OrdererMSP.admin')" }
    OrdererEndpoints:
      - orderer.example.com:7050

  - &Hospital
    Name: HospitalMSP
    ID: HospitalMSP
    MSPDir: ../organizations/peerOrganizations/hospital.example.com/msp
    Policies:
      Readers:      { Type: Signature, Rule: "OR('HospitalMSP.admin','HospitalMSP.peer','HospitalMSP.client')" }
      Writers:      { Type: Signature, Rule: "OR('HospitalMSP.admin','HospitalMSP.client')" }
      Admins:       { Type: Signature, Rule: "OR('HospitalMSP.admin')" }
      Endorsement:  { Type: Signature, Rule: "OR('HospitalMSP.peer')" }
    AnchorPeers:
      - Host: peer0.hospital
        Port: 7051

  - &Lab
    Name: LabMSP
    ID: LabMSP
    MSPDir: ../organizations/peerOrganizations/lab.example.com/msp
    Policies:
      Readers:      { Type: Signature, Rule: "OR('LabMSP.admin','LabMSP.peer','LabMSP.client')" }
      Writers:      { Type: Signature, Rule: "OR('LabMSP.admin','LabMSP.client')" }
      Admins:       { Type: Signature, Rule: "OR('LabMSP.admin')" }
      Endorsement:  { Type: Signature, Rule: "OR('LabMSP.peer')" }
    AnchorPeers:
      - Host: peer0.lab
        Port: 9051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_0: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    Readers:        { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers:        { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins:         { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
    LifecycleEndorsement: { Type: ImplicitMeta, Rule: "MAJORITY Endorsement" }
    Endorsement:    { Type: ImplicitMeta, Rule: "MAJORITY Endorsement" }
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  EtcdRaft:
    Consenters:
      - Host: orderer.example.com
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
  BatchTimeout: 2s
  BatchSize:
    MaxMessageCount: 10
    AbsoluteMaxBytes: 99 MB
    PreferredMaxBytes: 512 KB
  Organizations:
  Policies:
    Readers:  { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers:  { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins:   { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
    BlockValidation: { Type: ImplicitMeta, Rule: "ANY Writers" }

Channel: &ChannelDefaults
  Policies:
    Readers: { Type: ImplicitMeta, Rule: "ANY Readers" }
    Writers: { Type: ImplicitMeta, Rule: "ANY Writers" }
    Admins:  { Type: ImplicitMeta, Rule: "MAJORITY Admins" }
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  Genesis:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations: [*OrdererOrg]
      Capabilities:
        <<: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations: [*OrdererOrg]
  HealthcareChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations: [*OrdererOrg]
    Application:
      <<: *ApplicationDefaults
      Organizations: [*Hospital, *Lab]