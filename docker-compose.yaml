version: "3.9"

networks:
  fabric:
    name: fabric_net

services:
  ca.hospital:
    image: hyperledger/fabric-ca:1.5.12
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-hospital
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=7054
    ports: ["7054:7054"]
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes: ["./organizations/fabric-ca/hospital:/etc/hyperledger/fabric-ca-server"]
    networks: [fabric]

  ca.lab:
    image: hyperledger/fabric-ca:1.5.12
    environment:
      - FABRIC_CA_HOME=/etc/hyperledger/fabric-ca-server
      - FABRIC_CA_SERVER_CA_NAME=ca-lab
      - FABRIC_CA_SERVER_TLS_ENABLED=true
      - FABRIC_CA_SERVER_PORT=8054
    ports: ["8054:8054"]
    command: sh -c 'fabric-ca-server start -b admin:adminpw -d'
    volumes: ["./organizations/fabric-ca/lab:/etc/hyperledger/fabric-ca-server"]
    networks: [fabric]

  orderer.example.com:
    image: hyperledger/fabric-orderer:2.2.14
    environment:
      - FABRIC_LOGGING_SPEC=INFO
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_BOOTSTRAPMETHOD=file
      - ORDERER_GENERAL_BOOTSTRAPFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_TLS_ENABLED=true
      - ORDERER_GENERAL_TLS_PRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_TLS_CERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_TLS_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
      - ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE=/var/hyperledger/orderer/tls/server.crt
      - ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY=/var/hyperledger/orderer/tls/server.key
      - ORDERER_GENERAL_CLUSTER_ROOTCAS=[/var/hyperledger/orderer/tls/ca.crt]
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric
    command: orderer
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp:/var/hyperledger/orderer/msp
      - ./organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls:/var/hyperledger/orderer/tls
    ports: ["7050:7050"]
    networks: [fabric]

  peer0.hospital:
    image: hyperledger/fabric-peer:2.2.14
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.hospital
      - CORE_PEER_ADDRESS=peer0.hospital:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.hospital:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.hospital:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.hospital:7051
      - CORE_PEER_LOCALMSPID=HospitalMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/hospital.example.com/peers/peer0.hospital.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/hospital.example.com/peers/peer0.hospital.example.com/tls:/etc/hyperledger/fabric/tls
    ports: ["7051:7051"]
    depends_on: [couchdb0]
    networks: [fabric]

  peer0.lab:
    image: hyperledger/fabric-peer:2.2.14
    environment:
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_net
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=peer0.lab
      - CORE_PEER_ADDRESS=peer0.lab:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.lab:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.lab:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.lab:9051
      - CORE_PEER_LOCALMSPID=LabMSP
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb1:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./organizations/peerOrganizations/lab.example.com/peers/peer0.lab.example.com/msp:/etc/hyperledger/fabric/msp
      - ./organizations/peerOrganizations/lab.example.com/peers/peer0.lab.example.com/tls:/etc/hyperledger/fabric/tls
    ports: ["9051:9051"]
    depends_on: [couchdb1]
    networks: [fabric]

  couchdb0:
    image: couchdb:3.3.3
    environment: ["COUCHDB_USER=admin", "COUCHDB_PASSWORD=adminpw"]
    ports: ["5984:5984"]
    networks: [fabric]

  couchdb1:
    image: couchdb:3.3.3
    environment: ["COUCHDB_USER=admin", "COUCHDB_PASSWORD=adminpw"]
    ports: ["7984:5984"]
    networks: [fabric]

  ipfs0: { image: ipfs/kubo:v0.29.0, ports: ["4001:4001","5001:5001"], networks: [fabric] }
  ipfs1: { image: ipfs/kubo:v0.29.0, ports: ["4011:4001","5011:5001"], networks: [fabric] }
  ipfs2: { image: ipfs/kubo:v0.29.0, ports: ["4021:4001","5021:5001"], networks: [fabric] }
  ipfs3: { image: ipfs/kubo:v0.29.0, ports: ["4031:4001","5031:5001"], networks: [fabric] }
  ipfs4: { image: ipfs/kubo:v0.29.0, ports: ["4041:4001","5041:5001"], networks: [fabric] }
  ipfs5: { image: ipfs/kubo:v0.29.0, ports: ["4051:4001","5051:5001"], networks: [fabric] }
  ipfs6: { image: ipfs/kubo:v0.29.0, ports: ["4061:4001","5061:5001"], networks: [fabric] }
  ipfs7: { image: ipfs/kubo:v0.29.0, ports: ["4071:4001","5071:5001"], networks: [fabric] }
  ipfs8: { image: ipfs/kubo:v0.29.0, ports: ["4081:4001","5081:5001"], networks: [fabric] }
  ipfs9: { image: ipfs/kubo:v0.29.0, ports: ["4091:4001","5091:5001"], networks: [fabric] }